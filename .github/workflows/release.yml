name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "覆盖发布标签的版本号，不填则使用当前 ref"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, target: macos-x86_64 }
          - { os: macos-15,       target: macos-arm64 }
          - { os: windows-2022,   target: windows-x86_64 }
          - { os: windows-11-arm, target: windows-arm64 }
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve package version
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          normalized="$(python - "$version" <<'PY'
          import sys
          sys.path.insert(0, "src")
          from jsj_desktop.update.version import normalize_version
          print(normalize_version(sys.argv[1]))
          PY
          )"
          echo "version=$normalized" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12 (native architecture)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify native architecture
        run: python -c "import platform,sys; print(sys.version); print(platform.system(), platform.machine())"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Unit tests + sensitive-data gate
        shell: bash
        run: |
          set -e
          python -m unittest discover -s tests -t . -v
          python tools/check_no_pii.py --strict
          python -m jsj_desktop --self-test
          python tools/check_update_channel.py --offline

      - name: Build release package
        run: python packaging/build.py --target ${{ matrix.target }} --version "${{ steps.release_version.outputs.version }}"

      - name: Verify package version marker
        if: startsWith(matrix.target, 'macos')
        shell: bash
        run: |
          set -e
          marker="dist/raw/${{ matrix.target }}/JinshujuDesktop.app/Contents/Resources/APP_VERSION.txt"
          grep -F "JinshujuDesktop ${{ steps.release_version.outputs.version }}" "$marker"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "dist/raw/${{ matrix.target }}/JinshujuDesktop.app/Contents/Info.plist"

      - name: Verify package version marker
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        run: |
          $marker = "dist/raw/${{ matrix.target }}/JinshujuDesktop/APP_VERSION.txt"
          Select-String -Path $marker -SimpleMatch "JinshujuDesktop ${{ steps.release_version.outputs.version }}"

      - name: Verify macOS binary architecture
        if: startsWith(matrix.target, 'macos')
        run: |
          lipo -archs dist/raw/${{ matrix.target }}/JinshujuDesktop.app/Contents/MacOS/JinshujuDesktop
          file dist/raw/${{ matrix.target }}/JinshujuDesktop.app/Contents/MacOS/JinshujuDesktop

      - name: Verify macOS HTTPS certificate chain
        if: startsWith(matrix.target, 'macos')
        run: |
          # 冻结应用内实际发起一次 HTTPS 请求，验证随包 CA 根证书可用
          "dist/raw/${{ matrix.target }}/JinshujuDesktop.app/Contents/MacOS/JinshujuDesktop" --check-tls
          # 同时确认证书文件确实在 .app 内
          find "dist/raw/${{ matrix.target }}/JinshujuDesktop.app" -name cacert.pem -print

      - name: Verify macOS distribution (user flow)
        if: startsWith(matrix.target, 'macos')
        run: |
          set -e
          # 模拟用户：下载 zip → 解压 → 从副本启动；再从 DMG 挂载后启动
          T=$(mktemp -d)
          ZIP="dist/JinshujuDesktop-${{ matrix.target }}.zip"
          DMG="dist/JinshujuDesktop-${{ matrix.target }}.dmg"
          ditto -x -k "$ZIP" "$T/from-zip"
          ZAPP="$T/from-zip/JinshujuDesktop.app"
          test -x "$ZAPP/Contents/MacOS/JinshujuDesktop"
          codesign --verify --deep --strict "$ZAPP"
          xattr -dr com.apple.quarantine "$ZAPP" || true
          "$ZAPP/Contents/MacOS/JinshujuDesktop" --check-tls
          MNT="$T/dmg"
          mkdir -p "$MNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          DAPP="$MNT/JinshujuDesktop.app"
          test -x "$DAPP/Contents/MacOS/JinshujuDesktop"
          codesign --verify --deep --strict "$DAPP"
          "$DAPP/Contents/MacOS/JinshujuDesktop" --check-tls
          hdiutil detach "$MNT"
          echo "用户流程验证通过：zip 解压副本与 DMG 挂载副本均可启动"

      - name: Verify Windows executable exists
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        run: |
          Get-Item "dist/raw/${{ matrix.target }}/JinshujuDesktop/JinshujuDesktop.exe" | Select-Object FullName, Length
          Get-ChildItem "dist/*.zip" | Select-Object Name, Length

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve package version
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release-assets

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum JinshujuDesktop-*.zip JinshujuDesktop-*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate update manifest + legacy upgrade helper
        run: |
          set -e
          python tools/generate_update_manifest.py \
            --checksums release-assets/SHA256SUMS.txt \
            --output release-assets/latest.json
          python tools/check_update_channel.py --offline \
            --checksums release-assets/SHA256SUMS.txt
          cp tools/upgrade_legacy.py release-assets/JinshujuDesktop-Upgrade-Helper.py
          echo "--- latest.json ---"
          cat release-assets/latest.json

      - name: Publish release assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${{ steps.release_version.outputs.version }}"
          cat > release-notes.md <<EOF
          ## 下载

          本次覆盖发布版本为 v$version。提供 Intel Mac、Apple Silicon Mac、Windows x86_64 和 Windows ARM64 包，并附带 DMG、ZIP、SHA256SUMS.txt、latest.json 与升级助手。

          macOS 建议打开 DMG 后把应用拖入“应用程序”。Windows 更新会在旧程序退出后由独立 PowerShell 进程完成替换并在失败时回滚。

          应用内更新会校验版本、平台和 SHA-256。启动时默认后台检查更新，发现新版本时在主窗口顶部显示对应发布页入口。报名信息、档案和任务配置保存在本机数据目录。

          方案 B 图标、玻璃质感界面、黑色/白色/跟随系统主题和实时北京时间均随当前修复包提供。
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "v$version" --notes-file release-notes.md
          else
            gh release create "$tag" --title "v$version" --notes-file release-notes.md
          fi
          gh release upload "$tag" \
            release-assets/JinshujuDesktop-*.zip \
            release-assets/JinshujuDesktop-*.dmg \
            release-assets/SHA256SUMS.txt \
            release-assets/latest.json \
            release-assets/JinshujuDesktop-Upgrade-Helper.py \
            --clobber
