name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "覆盖发布标签的版本号，不填则使用当前 ref"
        required: false
        type: string
      tag:
        description: "从指定分支构建并更新此现有发布标签（可选）"
        required: false
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_VERSION: ${{ inputs.version }}

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, target: macos-x86_64 }
          - { os: macos-15,       target: macos-arm64 }
          - { os: windows-2022,   target: windows-x86_64 }
          - { os: windows-11-arm, target: windows-arm64 }
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve package version
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION:-${RELEASE_TAG#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag and version must match (vX.Y.Z)" >&2
            exit 1
          fi
          normalized="$(python - "$version" <<'PY'
          import sys
          sys.path.insert(0, "src")
          from jsj_desktop.update.version import normalize_version
          print(normalize_version(sys.argv[1]))
          PY
          )"
          echo "version=$normalized" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12 (native architecture)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify native architecture
        run: python -c "import platform,sys; print(sys.version); print(platform.system(), platform.machine())"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Install Inno Setup
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        run: |
          $paths = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          if (-not ($paths | Where-Object { Test-Path $_ })) {
            choco install innosetup --no-progress -y
          }

      - name: Unit tests + sensitive-data gate
        shell: bash
        run: |
          set -e
          python -m unittest discover -s tests -t . -v
          python tools/check_no_pii.py --strict
          python -m jsj_desktop --self-test
          python tools/check_update_channel.py --offline

      - name: Build release package
        run: python packaging/build.py --target ${{ matrix.target }} --version "${{ steps.release_version.outputs.version }}"

      - name: Verify package version marker
        if: startsWith(matrix.target, 'macos')
        shell: bash
        run: |
          set -e
          marker="dist/raw/${{ matrix.target }}/JinshujuDesktop.app/Contents/Resources/APP_VERSION.txt"
          grep -Fx "Version: ${{ steps.release_version.outputs.version }}" "$marker"
          grep -Fx "JinshujuDesktop $(python -c 'from jsj_desktop.update.manifest import local_manifest; print(local_manifest()["latest_version"])')" "$marker"

      - name: Verify package version marker
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        run: |
          $marker = "dist/stage/${{ matrix.target }}/JinshujuDesktop/APP_VERSION.txt"
          if (-not (Select-String -Path $marker -SimpleMatch "Version: ${{ steps.release_version.outputs.version }}")) {
            throw "安装包的产品版本标记不匹配"
          }
          $expected = (Get-Content -Raw update/latest.json | ConvertFrom-Json).latest_version
          if ((Get-Content -LiteralPath $marker -TotalCount 1) -ne "JinshujuDesktop $expected") {
            throw "安装包构建标记与更新清单不匹配"
          }

      - name: Verify macOS binary architecture
        if: startsWith(matrix.target, 'macos')
        run: |
          lipo -archs dist/raw/${{ matrix.target }}/JinshujuDesktop.app/Contents/MacOS/JinshujuDesktop
          file dist/raw/${{ matrix.target }}/JinshujuDesktop.app/Contents/MacOS/JinshujuDesktop

      - name: Verify macOS HTTPS certificate chain
        if: startsWith(matrix.target, 'macos')
        run: |
          # 冻结应用内实际发起一次 HTTPS 请求，验证随包 CA 根证书可用
          "dist/raw/${{ matrix.target }}/JinshujuDesktop.app/Contents/MacOS/JinshujuDesktop" --check-tls
          # 同时确认证书文件确实在 .app 内
          find "dist/raw/${{ matrix.target }}/JinshujuDesktop.app" -name cacert.pem -print

      - name: Verify macOS distribution (user flow)
        if: startsWith(matrix.target, 'macos')
        run: |
          set -e
          # 模拟用户：下载 zip → 解压 → 从副本启动；再从 DMG 挂载后启动
          T=$(mktemp -d)
          ZIP="dist/JinFlow-${{ matrix.target }}.zip"
          DMG="dist/JinFlow-${{ matrix.target }}.dmg"
          ditto -x -k "$ZIP" "$T/from-zip"
          ZAPP="$T/from-zip/JinFlow.app"
          test -x "$ZAPP/Contents/MacOS/JinshujuDesktop"
          codesign --verify --deep --strict "$ZAPP"
          xattr -dr com.apple.quarantine "$ZAPP" || true
          "$ZAPP/Contents/MacOS/JinshujuDesktop" --check-tls
          MNT="$T/dmg"
          mkdir -p "$MNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          DAPP="$MNT/JinFlow.app"
          test -x "$DAPP/Contents/MacOS/JinshujuDesktop"
          codesign --verify --deep --strict "$DAPP"
          "$DAPP/Contents/MacOS/JinshujuDesktop" --check-tls
          hdiutil detach "$MNT"
          echo "用户流程验证通过：zip 解压副本与 DMG 挂载副本均可启动"

      - name: Verify Windows executable exists
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        run: |
          Get-Item "dist/raw/${{ matrix.target }}/JinshujuDesktop/JinshujuDesktop.exe" | Select-Object FullName, Length
          Get-Item "dist/JinFlow-${{ matrix.target }}-Setup.exe" | Select-Object FullName, Length
          Get-ChildItem "dist/JinFlow-*.zip" | Select-Object Name, Length

      - name: Verify Windows setup install and uninstall
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist/JinFlow-${{ matrix.target }}-Setup.exe").Path
          $install = Join-Path $env:RUNNER_TEMP "JinFlow-${{ matrix.target }}-installed"
          $installProc = Start-Process -FilePath $setup -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$install"
          ) -Wait -PassThru -WindowStyle Hidden
          if ($installProc.ExitCode -ne 0) { throw "setup.exe 安装失败，退出码 $($installProc.ExitCode)" }
          $exe = Join-Path $install "JinshujuDesktop\JinshujuDesktop.exe"
          if (-not (Test-Path $exe)) { throw "安装后未找到应用程序：$exe" }
          $selfTest = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru -WindowStyle Hidden
          if ($selfTest.ExitCode -ne 0) { throw "安装后的程序自检失败，退出码 $($selfTest.ExitCode)" }
          $uninstaller = Join-Path $install "unins000.exe"
          $uninstallProc = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          ) -Wait -PassThru -WindowStyle Hidden
          if ($uninstallProc.ExitCode -ne 0) { throw "卸载失败，退出码 $($uninstallProc.ExitCode)" }
          if (Test-Path $install) { throw "卸载后安装目录仍存在：$install" }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release-assets

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release-assets
          for target in macos-arm64 macos-x86_64 windows-arm64 windows-x86_64; do
            test -s "JinFlow-$target.zip"
            case "$target" in
              macos-*) test -s "JinFlow-$target.dmg" ;;
              windows-*) test -s "JinFlow-$target-Setup.exe" ;;
            esac
          done
          sha256sum JinFlow-*.zip JinFlow-*.dmg JinFlow-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate update manifest + legacy upgrade helper
        run: |
          set -e
          python tools/generate_update_manifest.py \
            --checksums release-assets/SHA256SUMS.txt \
            --output release-assets/latest.json
          python tools/check_update_channel.py --offline \
            --checksums release-assets/SHA256SUMS.txt
          cp tools/upgrade_legacy.py release-assets/JinFlow-Upgrade-Helper.py
          echo "--- latest.json ---"
          cat release-assets/latest.json

      - name: Publish release assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          notes="docs/releases/$tag.md"
          if [ ! -f "$notes" ]; then
            notes=release-notes.md
            printf '## 下载\n\nJinFlow %s 提供 macOS 和 Windows 的 x86_64 与 ARM64 安装包。\n' "$tag" > "$notes"
          fi
          old_tag=''
          if [ -n "$REPLACE_TAG" ]; then
            gh release view "$tag" >/dev/null
            test "$(jq -r .tag release-assets/latest.json)" = "$tag"
            old_tag=$(git ls-remote --refs origin "refs/tags/$tag" | cut -f 1)
            test -n "$old_tag"
          elif ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes"
          fi
          gh release upload "$tag" \
            release-assets/JinFlow-*.zip \
            release-assets/JinFlow-*.dmg \
            release-assets/JinFlow-*.exe \
            release-assets/JinFlow-Upgrade-Helper.py \
            --clobber
          gh release upload "$tag" release-assets/SHA256SUMS.txt --clobber
          gh release upload "$tag" release-assets/latest.json --clobber
          if [ -n "$old_tag" ]; then
            git push "--force-with-lease=refs/tags/$tag:$old_tag" origin "$GITHUB_SHA:refs/tags/$tag"
          fi
          gh release edit "$tag" --title "$tag" --notes-file "$notes"
